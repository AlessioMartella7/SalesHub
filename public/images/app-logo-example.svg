<!--
  Generic placeholder logo for public/open-source distribution.
  This file intentionally contains ONLY neutral artwork (no embedded raster images,
  no legacy company branding, no external references).
-->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="app-logo-gradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#app-logo-gradient)"/>

  <!-- Inner chart-like bars -->
  <rect x="32" y="64" width="12" height="28" rx="2" fill="white" fill-opacity="0.85"/>
  <rect x="52" y="48" width="12" height="44" rx="2" fill="white" fill-opacity="0.9"/>
  <rect x="72" y="40" width="12" height="52" rx="2" fill="white" fill-opacity="0.95"/>
  <rect x="92" y="56" width="12" height="36" rx="2" fill="white" fill-opacity="0.8"/>

  <!-- Accent dot -->
  <circle cx="44" cy="44" r="8" fill="white" fill-opacity="0.9"/>
</svg>
